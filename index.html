<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نظام إدارة المكتب الهندسي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=Zain:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#16243C;
    --navy-2:#1E3358;
    --steel:#2B4C7E;
    --amber:#E2A03F;
    --amber-dark:#B87A1F;
    --paper:#EEEAE2;
    --card:#FFFFFF;
    --ink:#20242B;
    --ink-soft:#5B6472;
    --line:#DCD6C9;
    --danger:#B4472A;
    --success:#3F7D58;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Tajawal',sans-serif;
    background:var(--paper);
    color:var(--ink);
    min-height:100vh;
  }
  #app{min-height:100vh;}

  /* ---------- Login ---------- */
  .login-wrap{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
      linear-gradient(var(--navy),var(--navy)),
      repeating-linear-gradient(0deg, rgba(255,255,255,0.045) 0 1px, transparent 1px 40px),
      repeating-linear-gradient(90deg, rgba(255,255,255,0.045) 0 1px, transparent 1px 40px);
    padding:24px;
  }
  .login-card{
    background:var(--card);
    width:100%;
    max-width:380px;
    border-radius:4px;
    padding:36px 32px 30px;
    box-shadow:0 20px 50px rgba(0,0,0,0.35);
    border-top:5px solid var(--amber);
  }
  .brand-mark{
    display:flex;align-items:center;gap:10px;margin-bottom:6px;
  }
  .brand-mark .sq{width:14px;height:14px;background:var(--amber);}
  .brand-mark .sq2{width:14px;height:14px;background:var(--navy);margin-inline-start:-4px;}
  .login-card h1{
    font-size:21px;font-weight:900;margin:14px 0 2px;color:var(--navy);
  }
  .login-card p.sub{color:var(--ink-soft);font-size:13.5px;margin:0 0 24px;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:12.5px;color:var(--ink-soft);margin-bottom:6px;font-weight:700;}
  .field input, .field select, .field textarea{
    width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:3px;
    font-family:inherit;font-size:14.5px;background:#FBFAF7;color:var(--ink);
  }
  .field input:focus, .field select:focus, .field textarea:focus{
    outline:none;border-color:var(--steel);background:#fff;
  }
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    padding:10px 18px;border-radius:3px;border:none;cursor:pointer;
    font-family:inherit;font-weight:700;font-size:14px;transition:filter .12s ease;
  }
  .btn:active{filter:brightness(0.92);}
  .btn-primary{background:var(--navy);color:#fff;width:100%;padding:12px;}
  .btn-primary:hover{background:var(--navy-2);}
  .btn-amber{background:var(--amber);color:var(--navy);}
  .btn-amber:hover{background:var(--amber-dark);color:#fff;}
  .btn-ghost{background:transparent;color:var(--ink-soft);border:1.5px solid var(--line);}
  .btn-ghost:hover{border-color:var(--ink-soft);color:var(--ink);}
  .btn-danger{background:#fff;color:var(--danger);border:1.5px solid var(--danger);}
  .btn-danger:hover{background:var(--danger);color:#fff;}
  .btn-sm{padding:6px 12px;font-size:13px;}
  .err{color:var(--danger);font-size:13px;margin:-8px 0 14px;font-weight:700;}

  /* ---------- Main layout ---------- */
  .layout{display:flex;min-height:100vh;}
  .sidebar{
    width:236px;flex-shrink:0;background:var(--navy);color:#EDEBE6;
    display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;
  }
  .sidebar .brand{padding:22px 20px 16px;border-bottom:1px solid rgba(255,255,255,0.1);}
  .sidebar .brand .sq{width:12px;height:12px;background:var(--amber);display:inline-block;margin-inline-end:8px;}
  .sidebar .brand b{font-size:15px;letter-spacing:.3px;}
  .sidebar .brand small{display:block;color:#9AA6B8;font-size:11.5px;margin-top:4px;}
  .nav{padding:10px 0;flex:1;}
  .nav a{
    display:block;padding:11px 22px;color:#C7CEDA;text-decoration:none;font-size:14px;
    font-weight:500;border-inline-start:3px solid transparent;cursor:pointer;
  }
  .nav a:hover{background:rgba(255,255,255,0.05);color:#fff;}
  .nav a.active{border-inline-start-color:var(--amber);background:rgba(255,255,255,0.07);color:#fff;font-weight:700;}
  .nav .grp-label{padding:16px 22px 6px;font-size:11px;color:#7C8AA0;font-weight:700;letter-spacing:.4px;}
  .sidebar-foot{padding:14px 20px;border-top:1px solid rgba(255,255,255,0.1);font-size:12.5px;color:#9AA6B8;}
  .sidebar-foot b{color:#fff;display:block;font-size:13.5px;margin-bottom:2px;}

  .main{flex:1;min-width:0;}
  .topbar{
    background:#fff;border-bottom:1px solid var(--line);padding:16px 28px;
    display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5;
  }
  .topbar h2{margin:0;font-size:19px;font-weight:900;color:var(--navy);}
  .topbar .user-chip{display:flex;align-items:center;gap:12px;}
  .user-chip .who{font-size:13px;color:var(--ink-soft);text-align:left;}
  .user-chip .who b{color:var(--ink);display:block;font-size:13.5px;}
  .content{padding:24px 28px 60px;}

  .toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap;}
  .toolbar .filters{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  .toolbar select{padding:8px 10px;border:1.5px solid var(--line);border-radius:3px;font-family:inherit;background:#fff;font-size:13.5px;}

  .cards-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:22px;}
  .stat-card{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:16px 18px;border-top:3px solid var(--steel);}
  .stat-card.amber{border-top-color:var(--amber);}
  .stat-card.danger{border-top-color:var(--danger);}
  .stat-card.success{border-top-color:var(--success);}
  .stat-card .n{font-size:26px;font-weight:900;color:var(--navy);}
  .stat-card .l{font-size:12.5px;color:var(--ink-soft);margin-top:2px;}

  table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:4px;overflow:hidden;}
  thead th{background:#F4F1E9;color:var(--navy);text-align:right;font-size:12.5px;font-weight:800;padding:11px 14px;border-bottom:2px solid var(--line);}
  tbody td{padding:11px 14px;font-size:13.5px;border-bottom:1px solid var(--line);color:var(--ink);}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:#FAF9F5;}
  .empty-row td{text-align:center;color:var(--ink-soft);padding:34px;font-size:14px;}
  .badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:700;background:#EAE6DA;color:var(--ink-soft);}
  .badge.ok{background:#E2EFE6;color:var(--success);}
  .badge.warn{background:#FBF0DC;color:var(--amber-dark);}
  .badge.bad{background:#F6E0D8;color:var(--danger);}
  .row-actions{display:flex;gap:6px;justify-content:flex-end;}
.attachment-inline{display:inline-flex;align-items:center;gap:2px;margin:2px 3px;padding:2px 4px;border:1px solid var(--line);border-radius:6px;background:rgba(255,255,255,.03)}
.row-order{font-weight:800;text-align:center;min-width:42px}
.sort-label{font-weight:800;color:var(--ink)}
.sort-current{font-size:12px;color:var(--ink-soft);padding:6px 8px;border-radius:8px;background:rgba(255,255,255,.04)}

  .link-btn{background:none;border:none;color:var(--steel);cursor:pointer;font-family:inherit;font-size:12.5px;font-weight:700;padding:4px 6px;}
  .link-btn:hover{text-decoration:underline;}
  .link-btn.danger{color:var(--danger);}

  .no-access{
    background:#fff;border:1px dashed var(--line);border-radius:4px;padding:40px;text-align:center;color:var(--ink-soft);
  }

  /* modal */
  .overlay{position:fixed;inset:0;background:rgba(22,36,60,0.55);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:50;overflow-y:auto;}
  .modal{background:#fff;border-radius:4px;width:100%;max-width:560px;padding:26px 26px 22px;border-top:5px solid var(--navy);}
  .modal h3{margin:0 0 18px;font-size:17px;color:var(--navy);font-weight:900;}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .form-grid .full{grid-column:1 / -1;}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;border-top:1px solid var(--line);padding-top:16px;}
.pdf-viewer{position:fixed;inset:3vh 3vw;z-index:10000;background:#fff;border-radius:12px;box-shadow:0 20px 80px rgba(0,0,0,.45);display:flex;flex-direction:column;overflow:hidden;}
.pdf-viewer-head{padding:10px 14px;background:#0b1f3a;color:#fff;display:flex;align-items:center;justify-content:space-between;gap:8px;}
.pdf-viewer iframe{flex:1;border:0;width:100%;}
.attachment-list{display:flex;flex-direction:column;gap:7px;margin-top:8px;}
.attachment-item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fafafa;}
.print-document{background:#fff;color:#111;max-width:900px;margin:0 auto;padding:30px;font-family:Arial,sans-serif;line-height:1.8;}
.print-document h1,.print-document h2{text-align:center;margin:8px 0;}
.print-document .doc-meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;border:1px solid #bbb;padding:12px;margin:15px 0;}
.print-document table{width:100%;border-collapse:collapse;margin:12px 0;}
.print-document th,.print-document td{border:1px solid #999;padding:7px;text-align:right;}
.print-document .signatures{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:50px;text-align:center;}
@media print{.no-print,.sidebar,.topbar{display:none!important}.print-document{max-width:none;padding:10px}.print-document{display:block!important}}
  .perm-table{width:100%;border-collapse:collapse;margin-top:6px;}
  .perm-table th{font-size:11.5px;color:var(--ink-soft);text-align:center;padding:6px 4px;font-weight:700;}
  .perm-table td{padding:6px 4px;font-size:12.5px;text-align:center;border-top:1px solid var(--line);}
  .perm-table td:first-child{text-align:right;font-weight:700;color:var(--ink);}
  .perm-table select{width:100%;padding:5px 4px;font-size:12px;border:1px solid var(--line);border-radius:3px;}

  .section-note{font-size:12.5px;color:var(--ink-soft);background:#F4F1E9;border:1px dashed var(--line);padding:10px 12px;border-radius:3px;margin-bottom:16px;}

  @media (max-width:820px){
    .sidebar{position:fixed;right:0;top:0;transform:translateX(100%);transition:transform .2s ease;z-index:40;box-shadow:-6px 0 20px rgba(0,0,0,0.3);}
    .sidebar.open{transform:translateX(0);}
    .topbar{padding:14px 16px;}
    .content{padding:16px;}
    .form-grid{grid-template-columns:1fr;}
    .menu-btn{display:inline-flex !important;}
  }
  .menu-btn{display:none;background:none;border:1.5px solid var(--line);border-radius:3px;padding:7px 10px;cursor:pointer;font-size:16px;}

  .print-only{display:none;}
  @media print{
    .sidebar, .topbar, .no-print, .overlay { display:none !important; }
    body{background:#fff;}
    .content{padding:0;}
    .print-only{display:block;}
    table{border:1px solid #000;}
    thead th, tbody td{border-color:#999;}
  }

/* ===================== EPMS V6 UI — Screenshot-inspired redesign ===================== */
:root{
  --epms-blue:#0b63d8;
  --epms-blue2:#0878ee;
  --epms-cyan:#00a9e8;
  --epms-navy:#071b36;
  --epms-navy2:#0b2c55;
  --epms-panel:#f6f9fd;
  --epms-line:#d9e5f2;
  --epms-text:#102b4d;
  --epms-muted:#6c7d91;
}
body{font-family:'Tajawal','Zain',sans-serif;background:#eef4fa;color:var(--epms-text);}
.layout{background:#eef4fa;}
.sidebar{
  width:292px;background:linear-gradient(180deg,#061a35 0%,#092b52 42%,#061b35 100%);
  color:#fff;border-left:1px solid rgba(255,255,255,.08);
  box-shadow:-8px 0 30px rgba(3,18,38,.16);z-index:20;
}
.sidebar .brand{
  padding:14px 15px 12px;text-align:right;border-bottom:1px solid rgba(255,255,255,.12);
  background:linear-gradient(135deg,rgba(0,169,232,.18),rgba(11,99,216,.08));
}
.sidebar .brand-top{display:flex;align-items:center;gap:10px;justify-content:flex-start;direction:ltr}
.sidebar .brand-logo{font-size:28px;font-weight:900;line-height:1;color:#fff;letter-spacing:-1px}
.sidebar .brand-title{display:flex;flex-direction:column;align-items:flex-start;line-height:1.05}
.sidebar .brand-title b{font-size:24px;letter-spacing:1px;color:#fff}
.sidebar .brand-title small{font-size:9px;color:#a9c1dc;letter-spacing:.4px;margin-top:4px}
.sidebar .brand-sub{display:block;color:#d9ecff;font-size:11px;font-weight:700;margin-top:9px;padding-top:8px;border-top:1px solid rgba(255,255,255,.08)}
.sidebar .brand .sq{width:11px;height:28px;border-radius:3px;background:linear-gradient(#49c8ff,#0b63d8);display:inline-block;margin-inline-end:7px;vertical-align:middle;}
.sidebar .brand b{font-size:19px;font-weight:900;vertical-align:middle;letter-spacing:0;}
.sidebar .brand small{font-size:11px;color:#a9c1dc;margin-top:4px;}
.nav{padding:7px 8px 12px;overflow:visible;}
.nav-section{margin:0 0 2px;border-bottom:1px solid rgba(255,255,255,.055);}
.nav-section-title,.nav-single{
  display:flex;align-items:center;gap:9px;min-height:45px;padding:9px 13px;border-radius:10px;
  color:#edf6ff;text-decoration:none;font-size:14px;font-weight:700;cursor:pointer;
  transition:.16s;background:transparent;
}
.nav-section-title:hover,.nav-single:hover{background:rgba(29,132,232,.16);}
.nav-section-title.active,.nav-single.active{
  background:linear-gradient(90deg,#0865dc,#087cf0);box-shadow:0 5px 15px rgba(0,109,236,.25);color:#fff;
}
.nav-icon{width:25px;text-align:center;font-size:18px;flex:0 0 25px;}
.nav-chevron{margin-inline-start:auto;font-size:14px;opacity:.9;transition:transform .15s;}
.nav-section.open .nav-chevron{transform:rotate(180deg);}
.nav-children{display:none;padding:2px 0 7px 0;}
.nav-section.open .nav-children{display:block;}
.nav-child{
  display:flex;align-items:center;gap:8px;margin:2px 0;padding:8px 18px 8px 12px;border-radius:8px;
  color:#bcd0e7;font-size:12.5px;cursor:pointer;border-right:2px solid transparent;
}
.nav-child:hover{background:rgba(255,255,255,.06);color:#fff;}
.nav-child.active{background:rgba(0,153,240,.18);color:#fff;border-right-color:#31b9ff;}
.nav-child-dot{width:6px;height:6px;border-radius:50%;background:#5fa9df;flex:0 0 6px;}
.sidebar-utility{padding:10px 8px;border-top:1px solid rgba(255,255,255,.12);background:rgba(0,0,0,.08);}
.utility-row{display:flex;gap:7px;margin:5px 3px;}
.utility-btn{
  flex:1;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.045);color:#d8e8fa;
  border-radius:9px;padding:8px 6px;font-family:inherit;cursor:pointer;font-size:11.5px;
}
.utility-btn:hover{background:rgba(11,99,216,.35);}
.utility-btn.danger{color:#ff6b6b;border-color:rgba(255,80,80,.22);}
.lang-switch{display:flex;background:#06162d;border-radius:22px;padding:3px;margin:6px 3px;}
.lang-switch button{flex:1;border:0;background:transparent;color:#bcd0e7;border-radius:18px;padding:7px;font-family:inherit;cursor:pointer;}
.lang-switch button.active{background:#0b70e6;color:#fff;}
.sidebar-foot{padding:10px 16px;border-top:1px solid rgba(255,255,255,.1);font-size:11.5px;color:#9fb6d0;}
.sidebar-foot b{color:#fff;font-size:13px;}

.main{background:#eef4fa;}
.topbar{
  background:linear-gradient(135deg,#06234a 0%,#0b5fb7 48%,#0a8dcc 100%);
  color:#fff;border:0;padding:0 22px;min-height:78px;position:sticky;top:0;z-index:15;
  box-shadow:0 3px 16px rgba(4,29,58,.18);
}
.topbar h2{color:#fff;font-size:20px;}
.topbar .user-chip{color:#fff;}
.user-chip .who{color:#c8def4;text-align:right;}
.user-chip .who b{color:#fff;}
.user-avatar{width:42px;height:42px;border-radius:50%;background:#cfe7ff;color:#0a3a69;display:grid;place-items:center;font-size:22px;border:2px solid rgba(255,255,255,.65);}
.topbar-actions{display:flex;align-items:center;gap:9px;}
.top-action{border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.09);color:#fff;border-radius:9px;padding:8px 10px;cursor:pointer;font-family:inherit;position:relative;}
.top-action.has-label{display:inline-flex;align-items:center;gap:6px;padding:7px 11px;font-size:12px;font-weight:700;min-width:auto;height:auto;}
.top-action .tb-badge{position:absolute;top:-6px;left:-6px;min-width:18px;height:18px;padding:0 5px;border-radius:10px;font-size:10px;font-weight:900;display:grid;place-items:center;line-height:1;border:2px solid #0b5cae;}
.top-action .tb-badge.warn{background:#f0a11a;color:#fff;}
.top-action .tb-badge.ok{background:#11a96b;color:#fff;}
.top-action .tb-badge.bad{background:#e34b57;color:#fff;}
.top-action.pending-btn{background:rgba(240,161,26,.22);border-color:rgba(240,161,26,.45);}
.top-action.decided-btn{background:rgba(17,169,107,.18);border-color:rgba(17,169,107,.4);}
.approval-inbox-row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:12px 14px;border:1px solid #dbe7f1;border-radius:10px;background:#fbfdff;margin-bottom:8px;}
.approval-inbox-row:hover{background:#eef7ff;border-color:#a9d1f2;}
.approval-inbox-row .meta{font-size:12px;color:#53677b;margin-top:4px;line-height:1.6;}
.approval-inbox-row .acts{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;}

.content{padding:18px 20px 45px;max-width:1600px;margin:auto;}

.hero{
  min-height:126px;border-radius:14px;margin-bottom:16px;padding:22px 26px;color:#fff;position:relative;overflow:hidden;
  background:linear-gradient(120deg,#052d61,#0877d7 52%,#11a7d4);
  box-shadow:0 8px 22px rgba(4,70,130,.18);
}
.hero:after{content:"";position:absolute;inset:auto -20px -48px -20px;height:110px;opacity:.28;
  background:linear-gradient(180deg,transparent 0 28%,rgba(255,255,255,.16) 29% 34%,transparent 35%),
  repeating-linear-gradient(90deg,transparent 0 35px,rgba(255,255,255,.16) 36px 40px);
  transform:skewX(-16deg);
}
.hero h1{margin:0;font-size:27px;font-weight:900;position:relative;z-index:1;}
.hero p{margin:5px 0 0;color:#d9f1ff;position:relative;z-index:1;font-size:13px;}
.cards-row{gap:13px;margin-bottom:15px;}
.stat-card{
  background:#fff;border:1px solid var(--epms-line);border-radius:12px;padding:15px 17px;border-top:4px solid var(--epms-blue);
  box-shadow:0 4px 14px rgba(21,61,101,.07);position:relative;overflow:hidden;
}
.stat-card:before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:currentColor;opacity:.08;}
.stat-card .n{font-size:27px;color:#0b3970;}
.stat-card .l{font-size:12px;color:#718196;font-weight:700;}
.stat-icon{position:absolute;left:15px;top:14px;width:39px;height:39px;border-radius:10px;display:grid;place-items:center;background:#edf6ff;color:#0873dd;font-size:20px;}
.dashboard-grid{display:grid;grid-template-columns:1.15fr 1fr 1fr;gap:14px;}
.panel{background:#fff;border:1px solid var(--epms-line);border-radius:12px;box-shadow:0 4px 14px rgba(21,61,101,.06);padding:15px;}
.panel-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px;color:#103b6c;font-weight:900;font-size:15px;}
.panel-title small{font-size:11px;color:#8493a5;font-weight:500;}
.progress-row{display:grid;grid-template-columns:100px 1fr 48px;align-items:center;gap:8px;margin:10px 0;font-size:11.5px;}
.progress-track{height:9px;background:#e5edf5;border-radius:20px;overflow:hidden;}
.progress-fill{height:100%;border-radius:20px;background:linear-gradient(90deg,#0a70dc,#27b6e8);}
.quick-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;}
.quick-btn{border:1px solid #dce8f3;background:#f9fcff;border-radius:10px;padding:12px 7px;text-align:center;color:#21476e;cursor:pointer;font-family:inherit;font-size:11.5px;font-weight:700;}
.quick-btn:hover{border-color:#5aaaf0;background:#eef7ff;}

  if(!supabaseClient) return fallback;

    if(error || !data) return fallback;

  }catch(e){ console.error('load error', e); return fallback; }
}

    const { error } = await supabaseClient
      .from('erp_data')
      .upsert({ key, value, updated_at: new Date().toISOString() });

/* ===================== Permissions ===================== */
function permLevel(permKey){
  if(!currentUser) return 'none';
  if(currentUser.isAdmin) return 'edit';
  return (currentUser.permissions && currentUser.permissions[permKey]) || 'none';
}
function canView(permKey){ return permLevel(permKey) === 'view' || permLevel(permKey) === 'edit'; }
function canEdit(permKey){ return permLevel(permKey) === 'edit'; }
function approvalPolicy(moduleKey){
  const list=Array.isArray(STATE.approvalPolicies)?STATE.approvalPolicies:[];
  const found=list.find(x=>x.moduleKey===moduleKey);
  return found || {moduleKey,enabled:false,permissionKey:'',approverIds:[],approverSpecialties:[],requiredLevel:'edit',label:'',requireAll:false};
}
function approvalRequired(moduleKey){ return !!approvalPolicy(moduleKey).enabled; }
function userHasApprovalPermission(user, policy){
  if(!user) return false;
  if(user.isAdmin) return true;
  if(!policy) return false;
  // إذا حُددت تخصصات مؤهّلة: يكفي تطابق التخصص (أو كون المستخدم مختاراً بالاسم)
  const specs=Array.isArray(policy.approverSpecialties)?policy.approverSpecialties:[];
  const ids=Array.isArray(policy.approverIds)?policy.approverIds:[];
  if(specs.length || ids.length){
    const userSpec=(user.specialty||user.speciality||'').trim();
    const bySpec=specs.length && userSpec && specs.includes(userSpec);
    const byId=ids.length && ids.includes(user.id);
    if(bySpec || byId) return true;
    // إن وُجدت قوائم مؤهلين ولم يطابق المستخدم → لا يعتمد حتى لو كان لديه صلاحية القسم
    if(specs.length || ids.length) return false;
  }
  if(!policy.permissionKey) return false;
  const level=(user.permissions&&user.permissions[policy.permissionKey])||'none';
  return policy.requiredLevel==='view' ? (level==='view'||level==='edit') : level==='edit';
}
function isDesignatedApprover(moduleKey,user=currentUser){
  const p=approvalPolicy(moduleKey);
  if(!p.enabled) return false;
  if(user && user.isAdmin) return true;
  return userHasApprovalPermission(user,p);
}
function recordApprovalStatus(moduleKey,record){
  if(!approvalRequired(moduleKey)) return '';
  return record.approvalStatus || 'قيد الاعتماد';
}
function canApproveRecord(moduleKey,record){
  if(!record || !approvalRequired(moduleKey)) return false;
  const st=recordApprovalStatus(moduleKey,record);
  if(st==='معتمد') return false;
  return isDesignatedApprover(moduleKey);
}
async function approveRecord(moduleKey,id,decision='اعتماد'){
  const rec=(STATE[moduleKey]||[]).find(x=>x.id===id); if(!rec)return;
  if(!canApproveRecord(moduleKey,rec)){alert('لا تملك صلاحية اعتماد هذا البند. يجب أن تكون من التخصصات أو المديرين المحددين من الأدمن.');return;}
  rec.approvalStatus=decision==='اعتماد'?'معتمد':'مرفوض';
  rec.approvedBy=currentUser.username;
  rec.approvedByName=currentUser.name;
  rec.approvedAt=new Date().toISOString();
  rec.approvalDecision=decision;
  rec.approverSpecialty=currentUser.specialty||'';
  await dbSet(moduleKey,STATE[moduleKey]);
  render();
}

const DEFAULT_APPROVAL_MODULES=['purchases','deliveries','warehouseItems','warehouseTx','warehousesLoc','siteExecution','siteIncidents','contracts','extracts','changeOrders','claims','handoverRequests'];
function ensureDefaultApprovalPolicies(){
  if(!Array.isArray(STATE.approvalPolicies)) STATE.approvalPolicies=[];
  // لا نفرض التفعيل تلقائياً؛ فقط نضمن أن الحقول الجديدة موجودة في السياسات المحفوظة
  STATE.approvalPolicies=STATE.approvalPolicies.map(p=>({
    approverSpecialties:[],
    requireAll:false,
    ...p,
    approverSpecialties:Array.isArray(p.approverSpecialties)?p.approverSpecialties:[],
    approverIds:Array.isArray(p.approverIds)?p.approverIds:[]
  }));
}
function approvalRecordTitle(moduleKey, r){
  if(!r) return 'سجل';
  return r.name||r.title||r.number||r.contractNumber||r.requestNo||r.itemName||r.activity||r.subject||r.phase||r.entryType||r.requestType||r.id||'سجل';
}
function collectApprovalItems(statusFilter){
  // statusFilter: 'pending' | 'decided' | 'approved' | 'rejected'
  const out=[];
  for(const key of Object.keys(MODULES)){
    if(!approvalRequired(key)) continue;
    const mod=MODULES[key];
    if(!canView(mod.permKey) && !(currentUser&&currentUser.isAdmin)) continue;
    const list=scopeRecords(STATE[key]||[]);
    for(const r of list){
      const st=recordApprovalStatus(key,r);
      if(!st) continue;
      if(statusFilter==='pending' && st!=='قيد الاعتماد') continue;
      if(statusFilter==='approved' && st!=='معتمد') continue;
      if(statusFilter==='rejected' && st!=='مرفوض') continue;
      if(statusFilter==='decided' && st!=='معتمد' && st!=='مرفوض') continue;
      out.push({
        moduleKey:key,
        title:mod.title,
        record:r,
        status:st,
        label:approvalRecordTitle(key,r),
        project:mod.hasProject?projectName(r.projectId):'',
        createdBy:r.createdByName||r.createdBy||'—',
        approvedBy:r.approvedByName||r.approvedBy||'',
        approvedAt:r.approvedAt||'',
        canApprove:canApproveRecord(key,r)
      });
    }
  }
  // الأحدث أولاً قدر الإمكان
  out.sort((a,b)=>{
    const ad=a.record.updatedAt||a.record.approvedAt||a.record.date||a.record.requestDate||a.record.createdAt||'';
    const bd=b.record.updatedAt||b.record.approvedAt||b.record.date||b.record.requestDate||b.record.createdAt||'';
    return String(bd).localeCompare(String(ad));
  });
  return out;
}

function incidentApprovalSummary(r){

function projectScope(user=currentUser){
  if(!user || user.isAdmin) return {mode:'all', ids:[]};

function canAccessProject(projectId, user=currentUser){

function scopeProjectIds(user=currentUser){ return new Set(visibleProjects(user).map(p=>p.id)); }
function scopeRecords(list,user=currentUser){
  if(!Array.isArray(list)) return [];

const EPMS_LOGIN_CACHE_KEY = 'EPMS_V6_LOGIN_USERS_CACHE';
const EPMS_SESSION_KEY = 'EPMS_V6_FAST_SESSION';
const EPMS_DATA_LOADED_KEY = 'EPMS_V6_DATA_READY';

function readLoginCache(){
  try{ const x=JSON.parse(localStorage.getItem(EPMS_LOGIN_CACHE_KEY)||'null'); return Array.isArray(x)?x:null; }catch(e){ return null; }
}
function writeLoginCache(users){
  try{ if(Array.isArray(users) && users.length) localStorage.setItem(EPMS_LOGIN_CACHE_KEY,JSON.stringify(users)); }catch(e){}
}
function readFastSession(){
  try{ const x=JSON.parse(localStorage.getItem(EPMS_SESSION_KEY)||'null'); return x && x.username ? x : null; }catch(e){ return null; }
}
function writeFastSession(user){
  try{ localStorage.setItem(EPMS_SESSION_KEY,JSON.stringify({username:user.username,ts:Date.now()})); }catch(e){}
}
function clearFastSession(){ try{localStorage.removeItem(EPMS_SESSION_KEY)}catch(e){} }
function restoreFastSession(users){
  const sess=readFastSession();
  if(!sess || !sess.username || !Array.isArray(users)) return false;
  const found=users.find(x=>x.username===sess.username);
  if(!found) return false;
  currentUser=found;
  if(!currentRoute || currentRoute==='login') currentRoute='dashboard';
  return true;
}

async function boot(){
  if(SUPABASE_URL.includes('PASTE_') || SUPABASE_ANON_KEY.includes('PASTE_')){
    document.getElementById('app').innerHTML = `
      <div class="login-wrap"><div class="login-card">
        <h1>الإعداد غير مكتمل</h1><p class="sub">لم يتم توصيل قاعدة البيانات بعد.</p>
        <div class="section-note">افتح ملف الصفحة وابحث عن <b>SUPABASE_URL</b> و <b>SUPABASE_ANON_KEY</b> وضع بيانات مشروعك من Supabase.</div>
      </div></div>`; return;
  }

  // Fast start: use the locally cached users first so the login screen is not
  // blocked by loading the entire application/database.
  let users = readLoginCache();
  if(users && users.length){
    STATE.users = users;
    // Keep the authenticated session across normal page refresh/reload.
    // The session is local to this browser and is cleared only by explicit Logout.
    if(restoreFastSession(users)){
      render();
      loadAllData().then(()=>render()).catch(e=>console.warn('Background data load:',e));
    }else{
      render();
    }
    // Refresh users in the background only; never block the UI.
    dbGet('users', users).then(remote=>{
      if(Array.isArray(remote) && remote.length){
        STATE.users=remote; writeLoginCache(remote);
        if(currentUser){
          const fresh=remote.find(x=>x.username===currentUser.username);
          if(fresh) currentUser=fresh; else { currentUser=null; clearFastSession(); render(); return; }
          render();
        }
      }
    }).catch(e=>console.warn('Background users refresh:',e));
    return;
  }

  // First run only: users must be fetched once before login can be checked.
  try{
    users = await dbGet('users', null);
    if(!users || users.length===0){
      users=[{id:genId(),username:'admin',password:'admin123',name:'مدير النظام',isAdmin:true,permissions:{}}];
      await dbSet('users',users);
    }
    STATE.users=users; writeLoginCache(users);
    if(restoreFastSession(users)){
      render();
      loadAllData().then(()=>render()).catch(e=>console.warn('Background data load:',e));
    }else{
      render();
    }
  }catch(e){
    document.getElementById('app').innerHTML=loginScreen('تعذر الاتصال بقاعدة البيانات. حاول مرة أخرى.');
    attachLoginHandlers();
  }
}

async function loadAllData(){
  const load=(key)=>dbGet(key,[]).catch(e=>{console.warn('load '+key,e);return STATE[key]||[];});
  const keys=['approvalPolicies','specialties','siteIncidents','projects','phases','siteReports','techOffice','warehouseItems','warehouseTx','finance','extracts','contracts','company','planning','siteExecution','engineersList','labor','equipment','boq','purchases','suppliers','deliveries','warehousesLoc','invoices','accounting','qaqc','hse','documents','correspondence','changeOrders','claims','risks','handoverRequests','handoverInspections','handoverPunchList','handoverApprovals','handoverCloseouts','finalHandover','postHandoverMaint','execReports'];
  // Small batches reduce connection pressure and make the first dashboard paint fast.
  for(let i=0;i<keys.length;i+=5){
    await Promise.all(keys.slice(i,i+5).map(async k=>{STATE[k]=await load(k);}));
    if(i===0) render();
  }
  ensureDefaultApprovalPolicies();
  try{localStorage.setItem(EPMS_DATA_LOADED_KEY,String(Date.now()));}catch(e){}
}

function attachLoginHandlers(){
  const f=document.getElementById('loginForm'); if(!f)return;
  f.addEventListener('submit',async(e)=>{
    e.preventDefault();
    const u=document.getElementById('loginUser').value.trim(), p=document.getElementById('loginPass').value;
    const btn=document.getElementById('loginBtn'), status=document.getElementById('loginStatus');
    if(btn){btn.disabled=true;btn.textContent='جارٍ الدخول...';}
    let users=STATE.users&&STATE.users.length?STATE.users:readLoginCache()||[];
    let found=users.find(x=>x.username===u&&x.password===p);

    // Cached credentials make normal login immediate. If no match, do one
    // central lookup so newly-created/changed users still work.
    if(!found){
      try{
        status.textContent='جارٍ التحقق من قاعدة البيانات...';
        const remote=await Promise.race([
          dbGet('users',[]),
          new Promise((_,reject)=>setTimeout(()=>reject(new Error('timeout')),5000))
        ]);
        if(Array.isArray(remote)){users=remote;STATE.users=remote;writeLoginCache(remote);found=users.find(x=>x.username===u&&x.password===p);}
      }catch(err){ console.warn('Central login lookup:',err); }
    }
    if(!found){
      document.getElementById('app').innerHTML=loginScreen('اسم المستخدم أو كلمة المرور غير صحيحة');
      attachLoginHandlers(); return;
    }

    currentUser=found; currentRoute='dashboard'; writeFastSession(found);
    // Render immediately. Heavy modules are loaded after the dashboard appears.
    render();
    if(status)status.textContent='';
    loadAllData().then(()=>render()).catch(e=>console.warn('Background data load:',e));
  });
}

function specialtyList(){
  const defaults=['عام','مدني','معماري','كهرباء','ميكانيكا','صحي','حريق','HVAC','طرق وأعمال خارجية','تشطيبات','اختبارات وتشغيل'];
  const arr=Array.isArray(STATE.specialties)&&STATE.specialties.length?STATE.specialties:defaults;
  return [...new Set(arr.map(x=>String(x).trim()).filter(Boolean))];
}
async function saveSpecialties(){
  STATE.specialties=specialtyList();

}
function addSpecialty(){
  const name=prompt('اكتب اسم التخصص الجديد:'); if(!name)return;

  const arr=specialtyList(); if(arr.some(x=>x.toLowerCase()===n.toLowerCase())){alert('التخصص موجود بالفعل.');return;}
  arr.push(n); STATE.specialties=arr; saveSpecialties();
}
function deleteSpecialty(name){
  if(name==='عام'){alert('لا يمكن حذف تخصص عام.');return;}

  STATE.specialties=specialtyList().filter(x=>x!==name); saveSpecialties();
}

function runGlobalSearch(q){
  const box=document.getElementById('globalSearchResults'); if(!box)return;
  q=(q||'').trim().toLowerCase();
  if(!q){box.innerHTML='<div class="section-note">ابدأ بكتابة كلمة للبحث.</div>';return;}
  const sources=[['projects','المشاريع'],['contracts','العقود'],['documents','المستندات'],['extracts','المستخلصات'],['correspondence','المراسلات'],['purchases','المشتريات'],['risks','المخاطر']];
  const out=[];
  sources.forEach(([key,title])=>{(STATE[key]||[]).forEach(r=>{const text=JSON.stringify(r).toLowerCase();if(text.includes(q))out.push({key,title,r});});});
  box.innerHTML=out.slice(0,50).map(x=>`<div class="search-result" onclick="goRoute('${x.key}')"><b>${escapeHtml(x.title)}</b><span>${escapeHtml(x.r.name||x.r.title||x.r.number||x.r.description||x.r.subject||'سجل')}</span></div>`).join('')||'<div class="section-note">لا توجد نتائج مطابقة.</div>';
}

async function changePassword(){
  const old=document.getElementById('cp_old').value;
  const nw=document.getElementById('cp_new').value;
  const cf=document.getElementById('cp_confirm').value;
  if(old!==currentUser.password){alert('كلمة المرور الحالية غير صحيحة');return;}
  if(!nw||nw.length<6){alert('كلمة المرور الجديدة يجب ألا تقل عن 6 أحرف');return;}
  if(nw!==cf){alert('تأكيد كلمة المرور غير مطابق');return;}
  const idx=STATE.users.findIndex(u=>u.id===currentUser.id);
  if(idx<0)return;
  STATE.users[idx].password=nw; currentUser=STATE.users[idx];
  await dbSet('users',STATE.users); alert('تم تغيير كلمة المرور بنجاح'); render();
}

/* ---------- Handover / Inspection Workflow ---------- */
function handoverRequestById(id){ return STATE.handoverRequests.find(x=>x.id===id); }
function workflowCount(key,id){ return (STATE[key]||[]).filter(x=>x.requestId===id).length; }
function openHandoverWorkflow(id){ currentRoute='handoverCenter'; window.epmsHandoverId=id; render(); }
function addWorkflowItem(kind,id){
  const r=handoverRequestById(id); if(!r) return;
  const base={id:genId(),requestId:id,projectId:r.projectId,createdBy:currentUser.username,createdByName:currentUser.name,date:todayISO()};
  if(kind==='inspection'){
    STATE.handoverInspections.push({...base,status:'مجدول',inspector:r.inspector||'',result:'لم تتم المعاينة',notes:''});
    dbSet('handoverInspections',STATE.handoverInspections);
  } else if(kind==='punch'){
    STATE.handoverPunchList.push({...base,item:'ملاحظة جديدة',severity:'متوسط',responsible:r.contractor||'',dueDate:'',status:'مفتوح',notes:''});
    dbSet('handoverPunchList',STATE.handoverPunchList);
  } else if(kind==='approval'){
    STATE.handoverApprovals.push({...base,party:'الاستشاري / المالك',status:'قيد الاعتماد',decision:'',notes:''});
    dbSet('handoverApprovals',STATE.handoverApprovals);
  } else if(kind==='closeout'){
    STATE.handoverCloseouts.push({...base,documentType:'محضر استلام / تسليم',status:'قيد الإعداد',reference:'',notes:''});
    dbSet('handoverCloseouts',STATE.handoverCloseouts);
  }
  render();
}
async function advanceHandover(id,next){
  const r=handoverRequestById(id); if(!r || !canEdit('handoverRequests')) return; if(!canAccessProject(r.projectId)){alert('المشروع غير ضمن صلاحيات المستخدم.');return;}
  r.status=next;
  if(next==='مغلق'){ r.closeDate=todayISO(); r.result=r.result||'تم الإغلاق'; }
  r.updatedBy=currentUser.username; r.updatedByName=currentUser.name;
  await dbSet('handoverRequests',STATE.handoverRequests); render();
}

  const policy=approvalPolicy(key);

  return `<span class="badge ${cls}">${escapeHtml(st)}</span>${who}${hint}`;
}
function formatCell(mod, field, val){
  if(val === undefined || val === null || val === '') return '<span style="color:#B7B0A0">—</span>';
  const fdef = mod.fields.find(f=>f.name===field);
  if(fdef && fdef.type==='number') return Number(val).toLocaleString('ar-EG');
  if(fdef && fdef.name==='status'){
    const cls = /معتمد|منتهي$|ساري|مصروف/.test(val) ? (val==='مرفوض'||val==='ملغي'?'bad':'ok') : (val==='مرفوض'?'bad':'warn');
    return `<span class="badge ${cls}">${escapeHtml(val)}</span>`;
  }
  return escapeHtml(String(val));
}
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

async function saveRecord(){
  const {moduleKey, record, isNew} = modalState;
  const mod = MODULES[moduleKey];

  if(mod.hasProject){
    const pid = document.getElementById('f_projectId').value;
    if(!pid){ alert('من فضلك اختر المشروع'); return; }
    record.projectId = pid;
  }
  for(const f of mod.fields){
    const el = document.getElementById('f_'+f.name);
    let v = '';
    if(f.type==='multiselect'){
      v = [...document.querySelectorAll('input[name=\"f_'+f.name+'\"]:checked')].map(x=>x.value);
      if(f.required && !v.length){ alert('من فضلك اختر: '+f.label); return; }
    }else{
      v = el ? el.value : '';
      if(f.required && !v){ alert('من فضلك أدخل: '+f.label); return; }
    }
    record[f.name] = v;
  }
  if(moduleKey==='siteIncidents'){
    record.requiredSections=Array.isArray(record.requiredSections)?record.requiredSections:[];
    record.incidentApprovals=record.incidentApprovals||{};
    // Create a pending approval item only for newly selected sections; keep prior decisions.
    record.requiredSections.forEach(sec=>{ if(!record.incidentApprovals[sec]) record.incidentApprovals[sec]={status:'قيد الاعتماد'}; });
    // Remove approvals for sections that are no longer required.
    Object.keys(record.incidentApprovals).forEach(sec=>{ if(!record.requiredSections.includes(sec)) delete record.incidentApprovals[sec]; });
    const vals=record.requiredSections;
    const allApproved=vals.length>0 && vals.every(sec=>record.incidentApprovals[sec]&&record.incidentApprovals[sec].status==='معتمد');
    const anyRejected=vals.some(sec=>record.incidentApprovals[sec]&&record.incidentApprovals[sec].status==='مرفوض');
    record.approvalStatus=vals.length?(allApproved?'معتمد':anyRejected?'مرفوض':'قيد الاعتماد'):'بدون اعتماد';
  }
  if(approvalRequired(moduleKey)){
    // أي سجل جديد أو معدّل (غير معتمد بعد / أو أُعيد تعديله) يعود لقيد الاعتماد
    // إلا إذا كان المعتمد الحالي يعتمده مباشرة من شاشة القائمة
    if(isNew || record.approvalStatus==='معتمد' || record.approvalStatus==='مرفوض' || !record.approvalStatus){
      // إعادة التعديل بعد الاعتماد تعيد الطلب إلى دورة الاعتماد
      if(!isNew && (record.approvalStatus==='معتمد' || record.approvalStatus==='مرفوض')){
        record.previousApprovalStatus=record.approvalStatus;
        record.previousApprovedBy=record.approvedByName||record.approvedBy||'';
      }
      record.approvalStatus='قيد الاعتماد';
      record.approvedBy='';
      record.approvedByName='';
      record.approvedAt='';
      record.approvalDecision='';
    }
  }
  if(isNew){
    record.id = genId();
    record.createdBy = currentUser.username;
    record.createdByName = currentUser.name;
    STATE[moduleKey].push(record);
  } else {
    record.updatedBy = currentUser.username;
    record.updatedByName = currentUser.name;
    const idx = STATE[moduleKey].findIndex(r=>r.id===record.id);
    STATE[moduleKey][idx] = record;
  }

  const fileInput = document.getElementById('f_attachments');
  const files = fileInput && fileInput.files ? Array.from(fileInput.files) : [];
  if(files.length){
    const attachments = Array.isArray(record.attachments) ? record.attachments.slice() : [];
    for(const file of files){
      if(file.size > 4 * 1024 * 1024){ alert('تم تجاوز 4 ميجا للملف: '+file.name); continue; }
      try{
        const dataUrl = await new Promise((resolve, reject)=>{ const reader=new FileReader(); reader.onload=()=>resolve(reader.result); reader.onerror=reject; reader.readAsDataURL(file); });
        const attId=genId();
        await dbSet('attach_'+moduleKey+'_'+record.id+'_'+attId,{id:attId,name:file.name,dataUrl,type:file.type||'',size:file.size});
        attachments.push({id:attId,name:file.name,type:file.type||'',size:file.size});
      }catch(e){ console.error(e); alert('تعذر رفع المرفق: '+file.name); }
    }
    record.attachments=attachments; record.hasAttachment=attachments.length>0; record.attachmentName=attachments[0]?.name||'';
  }

  await dbSet(moduleKey, STATE[moduleKey]);
  modalState = null;
  render();
}

function renderAttachmentList(moduleKey, record){
  const arr=Array.isArray(record.attachments)?record.attachments:(record.hasAttachment?[{id:'legacy',name:record.attachmentName||'المرفق'}]:[]);
  if(!arr.length) return '<div style="font-size:12px;color:var(--ink-soft);margin-top:6px;">لا توجد مرفقات.</div>';
  return '<div class="attachment-list">'+arr.map(a=>`<div class="attachment-item"><span>📎 ${escapeHtml(a.name||'مرفق')}</span><span><button type="button" class="link-btn" onclick="openAttachment('${moduleKey}','${record.id}','${a.id||''}')">فتح</button> <button type="button" class="link-btn" onclick="downloadAttachment('${moduleKey}','${record.id}','${a.id||''}')">تنزيل</button></span></div>`).join('')+'</div>';
}
async function getAttachment(moduleKey,id,attId){
  if(attId){ const x=await dbGet('attach_'+moduleKey+'_'+id+'_'+attId,null); if(x)return x; }
  return await dbGet('attach_'+moduleKey+'_'+id,null);
}
async function openAttachment(moduleKey,id,attId){
  const data=await getAttachment(moduleKey,id,attId); if(!data){alert('تعذر العثور على المرفق.');return;}
  if((data.type||'').includes('pdf') || /^data:application\/pdf/i.test(data.dataUrl||'')){
    const wrap=document.createElement('div'); wrap.className='pdf-viewer';
    wrap.innerHTML=`<div class="pdf-viewer-head"><b>📄 ${escapeHtml(data.name||'PDF')}</b><div><button class="btn btn-ghost" style="color:#fff" onclick="downloadAttachment('${moduleKey}','${id}','${attId||''}')">تنزيل</button> <button class="btn btn-amber" onclick="this.closest('.pdf-viewer').remove()">إغلاق</button></div></div><iframe src="${data.dataUrl}" title="PDF"></iframe>`;
    document.body.appendChild(wrap);
  }else{ const w=window.open(); if(w){w.document.write(`<title>${escapeHtml(data.name||'مرفق')}</title><img src="${data.dataUrl}" style="max-width:100%;max-height:95vh;display:block;margin:auto">`);} }
}
async function downloadAttachment(moduleKey,id,attId){
  const data=await getAttachment(moduleKey,id,attId); if(!data){alert('تعذر العثور على المرفق.');return;}
  const a=document.createElement('a'); a.href=data.dataUrl; a.download=data.name||'attachment'; document.body.appendChild(a); a.click(); a.remove();
}

async function deleteRecord(moduleKey, id){
  const target=(STATE[moduleKey]||[]).find(r=>r.id===id);
  if(target && !canAccessProject(target.projectId)){ alert('هذا المشروع غير ضمن المشاريع المسموح بها لهذا المستخدم.'); return; }
  if(!confirm('هل تريد حذف هذا السجل؟')) return;
  STATE[moduleKey] = STATE[moduleKey].filter(r=>r.id!==id);
  await dbSet(moduleKey, STATE[moduleKey]);
  render();
}

async function saveUser(){
  const {record, isNew} = modalState;
  const name = document.getElementById('u_name').value.trim();
  const username = document.getElementById('u_username').value.trim();
  const password = document.getElementById('u_password').value;
  const isAdmin = document.getElementById('u_isAdmin').value === '1';

  if(!name || !username){ alert('من فضلك أدخل الاسم واسم المستخدم'); return; }
  if(isNew && !password){ alert('من فضلك أدخل كلمة مرور'); return; }
  const dup = STATE.users.find(u=>u.username===username && u.id!==record.id);
  if(dup){ alert('اسم المستخدم مستخدم بالفعل'); return; }

  const permissions = {};
  PERM_KEYS.forEach(pk=>{
    const el = document.getElementById('perm_'+pk);
    permissions[pk] = el ? el.value : 'none';
  });
  const scopeMode=document.getElementById('u_projectScopeMode')?.value||'all';
  const scopeIds=[...document.querySelectorAll('.project-scope-check:checked')].map(x=>x.value);
  if(!isAdmin && scopeMode!=='all' && scopeIds.length===0){ alert('حدد مشروعاً واحداً على الأقل أو اختر كافة المشاريع.'); return; }
  const projectScope={mode:scopeMode,ids:scopeMode==='all'?[]:scopeIds};

  const specialty=(document.getElementById('u_specialty')?.value||'').trim();
  if(isNew){
    STATE.users.push({
      id:genId(), name, username, password, isAdmin, permissions, projectScope, specialty
    });
  } else {
    const idx = STATE.users.findIndex(u=>u.id===record.id);
    STATE.users[idx].name = name;
    STATE.users[idx].username = username;
    if(password) STATE.users[idx].password = password;
    STATE.users[idx].isAdmin = isAdmin;
    STATE.users[idx].permissions = permissions;
    STATE.users[idx].projectScope = projectScope;
    STATE.users[idx].specialty = specialty;
    if(currentUser.id === record.id) currentUser = STATE.users[idx];
  }
  await dbSet('users', STATE.users);
  modalState = null;
  render();
}

function approvalSettingsHTML(){
  ensureDefaultApprovalPolicies();
  const priority=DEFAULT_APPROVAL_MODULES;
  const moduleKeys=[...priority.filter(k=>MODULES[k]), ...Object.keys(MODULES).filter(k=>!priority.includes(k))];
  const rows=moduleKeys.map(k=>{
    const mod=MODULES[k], p=approvalPolicy(k);
    const specs=(p.approverSpecialties||[]);
    const approvers=(p.approverIds||[]).map(id=>STATE.users.find(u=>u.id===id)?.name).filter(Boolean);
    const who=[];
    if(specs.length) who.push('تخصصات: '+specs.join('، '));
    if(approvers.length) who.push('مديرون: '+approvers.join('، '));
    if(!who.length && p.permissionKey) who.push('حسب صلاحية: '+(PERM_LABELS[p.permissionKey]||p.permissionKey));
    if(!who.length) who.push('—');
    const highlight=priority.includes(k)?'style="background:#f0f8ff"':'';
    return `<tr ${highlight}><td>${escapeHtml(mod.title)}${priority.includes(k)?' <span class="badge warn">مهم</span>':''}</td><td>${p.enabled?'<span class="badge ok">مفعّل</span>':'<span class="badge">غير مفعّل</span>'}</td><td>${escapeHtml(p.label||'—')}</td><td style="font-size:12px">${who.map(escapeHtml).join(' · ')}</td><td><button class="link-btn" onclick="openApprovalPolicy('${k}')">إعداد</button></td></tr>`;
  }).join('');
  return `<div class="hero"><h1>إدارة الاعتمادات</h1><p>تفعيل دورة الاعتماد للأقسام (المخازن، المشتريات، التوريدات، التنفيذ، المستحدثات، العقود، المستخلصات...). الأدمن وحده يختار التخصصات والمديرين المؤهلين للاعتماد.</p></div>
  <div class="panel"><div class="section-note">
    <b>كيف تعمل الدورة:</b>
    <ol style="margin:8px 0 0;padding-inline-start:20px;line-height:1.9">
      <li>فعّل الاعتماد للقسم المطلوب من زر «إعداد».</li>
      <li>اختر <b>التخصصات المؤهّلة</b> و/أو <b>المديرين المحددين</b> — هذا الإعداد للأدمن فقط.</li>
      <li>عند إضافة أو تعديل سجل في ذلك القسم يصبح حالته <b>قيد الاعتماد</b>.</li>
      <li>يظهر زر الاعتماد فقط للمستخدمين من التخصصات/المديرين المحددين (أو لمدير النظام).</li>
      <li>تعديل سجل معتمد يعيده تلقائياً إلى <b>قيد الاعتماد</b>.</li>
    </ol>
  </div>
  <div class="toolbar no-print"><div></div>
    <button class="btn btn-amber" onclick="enableSuggestedApprovals()">تفعيل سريع للأقسام المهمة</button>
  </div>
  <table><thead><tr><th>البند / القسم</th><th>الاعتماد</th><th>اسم الاعتماد</th><th>التخصصات والمديرون المؤهلون</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>
  `;
}
function openApprovalPolicy(moduleKey){
  try{
    if(!MODULES[moduleKey]){ alert('القسم غير موجود: '+moduleKey); return; }
    const p=approvalPolicy(moduleKey);
    modalState={
      isApprovalModal:true,
      isUserModal:false,
      moduleKey,
      record:{
        moduleKey,
        enabled:!!p.enabled,
        label:p.label||'',
        permissionKey:p.permissionKey||'',
        requiredLevel:p.requiredLevel||'edit',
        approverSpecialties:Array.isArray(p.approverSpecialties)?p.approverSpecialties.slice():[],
        approverIds:Array.isArray(p.approverIds)?p.approverIds.slice():[]
      }
    };
    render();
  }catch(err){
    console.error('openApprovalPolicy', err);
    alert('تعذر فتح إعداد الاعتماد: '+(err&&err.message?err.message:err));
  }
}
function approvalPolicyModalHTML(){
  if(!modalState || !modalState.isApprovalModal) return '';
  const k=modalState.moduleKey, p=modalState.record||{}, mod=MODULES[k];
  if(!mod){ return `<div class="overlay" onclick="closeModal()"><div class="modal"><h3>قسم غير معروف</h3><p>${escapeHtml(k||'')}</p><button class="btn btn-ghost" onclick="closeModal()">إغلاق</button></div></div>`; }
  const specs=specialtyList();
  const selectedSpecs=new Set(Array.isArray(p.approverSpecialties)?p.approverSpecialties:[]);
  const selectedIds=new Set(Array.isArray(p.approverIds)?p.approverIds:[]);
  const perms=PERM_KEYS.map(pk=>`<option value="${pk}" ${p.permissionKey===pk?'selected':''}>${escapeHtml(PERM_LABELS[pk])}</option>`).join('');
  const specChecks=specs.map(sp=>`<label style="display:flex;gap:8px;align-items:center;margin:6px 0;padding:6px 8px;border:1px solid #e5eef6;border-radius:6px;"><input type="checkbox" class="approver-spec-check" value="${escapeHtml(sp)}" ${selectedSpecs.has(sp)?'checked':''}><span>${escapeHtml(sp)}</span></label>`).join('');
  const managers=STATE.users.filter(u=>!u.isAdmin || true);
  const userChecks=managers.map(u=>{
    const sp=(u.specialty||'').trim();
    return `<label style="display:flex;gap:8px;align-items:center;margin:6px 0;padding:6px 8px;border:1px solid #e5eef6;border-radius:6px;"><input type="checkbox" class="approver-check" value="${u.id}" ${selectedIds.has(u.id)?'checked':''}><span><b>${escapeHtml(u.name)}</b> <small style="color:#6c7d91">(${escapeHtml(u.username)}${sp?' · '+escapeHtml(sp):''}${u.isAdmin?' · مدير نظام':''})</small></span></label>`;
  }).join('');
  return `<div class="overlay" onclick="if(event.target===this) closeModal()"><div class="modal" style="max-width:780px"><h3>إعداد اعتماد — ${escapeHtml(mod.title)}</h3>
  <div class="section-note">الأدمن فقط يحدد من يحق له الاعتماد: عبر <b>التخصص</b> (مثل مدني / معماري / مدير مشروع) و/أو اختيار <b>مديرين بأسمائهم</b>.</div>
  <div class="form-grid">
    <div class="field"><label>تفعيل الاعتماد لهذا القسم</label><select id="ap_enabled"><option value="0" ${!p.enabled?'selected':''}>غير مفعّل</option><option value="1" ${p.enabled?'selected':''}>مفعّل</option></select></div>
    <div class="field"><label>اسم الاعتماد الظاهر</label><input id="ap_label" value="${escapeHtml(p.label||'')}" placeholder="مثال: اعتماد مدير المشروع / المكتب الفني"></div>
    <div class="field full"><label>صلاحية القسم المرتبطة (اختياري — كاحتياطي إن لم تُحدد تخصصات أو مديرون)</label><select id="ap_permission"><option value="">— بدون ربط بصلاحية قسم —</option>${perms}</select></div>
    <div class="field"><label>الحد الأدنى لصلاحية القسم (إن وُجدت)</label><select id="ap_level"><option value="edit" ${p.requiredLevel!=='view'?'selected':''}>تعديل</option><option value="view" ${p.requiredLevel==='view'?'selected':''}>مشاهدة أو تعديل</option></select></div>
  </div>
  <div class="field full" style="margin-top:14px"><label>التخصصات المؤهّلة للاعتماد (يختارها الأدمن)</label>
    <div style="max-height:180px;overflow:auto;border:1px solid #d3e0ec;padding:10px;border-radius:8px;display:grid;grid-template-columns:1fr 1fr;gap:4px;">${specChecks||'<div class="section-note">لا توجد تخصصات. أضفها من ملخصات التخصصات.</div>'}</div>
    <div class="section-note" style="margin-top:6px">أي مستخدم مُسجَّل بتخصص مطابق يصبح مؤهلاً للاعتماد تلقائياً.</div>
  </div>
  <div class="field full" style="margin-top:12px"><label>مديرون / أشخاص محددون بالاسم (اختياري)</label>
    <div style="max-height:200px;overflow:auto;border:1px solid #d3e0ec;padding:10px;border-radius:8px">${userChecks||'<div class="section-note">لا يوجد مستخدمون.</div>'}</div>
    <div class="section-note" style="margin-top:6px">يمكن الجمع بين التخصصات والأشخاص. إن تُرك الاثنان فارغين مع وجود صلاحية قسم، يعتمد من يملك تلك الصلاحية.</div>
  </div>
  <div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">إلغاء</button><button class="btn btn-primary" onclick="saveApprovalPolicy()">حفظ إعداد الاعتماد</button></div></div></div>`;
}
function refreshApprovalApprovers(){ /* لم يعد مطلوباً — القوائم ثابتة في النافذة */ }
async function saveApprovalPolicy(){
  const k=modalState.moduleKey, p=modalState.record;
  p.enabled=document.getElementById('ap_enabled').value==='1';
  p.label=document.getElementById('ap_label').value.trim();
  p.permissionKey=document.getElementById('ap_permission').value;
  p.requiredLevel=document.getElementById('ap_level').value;
  p.approverIds=[...document.querySelectorAll('.approver-check:checked')].map(x=>x.value);
  p.approverSpecialties=[...document.querySelectorAll('.approver-spec-check:checked')].map(x=>x.value);
  if(p.enabled && !p.permissionKey && !p.approverSpecialties.length && !p.approverIds.length){
    alert('لتفعيل الاعتماد: اختر تخصصاً واحداً على الأقل، أو مديراً بالاسم، أو صلاحية قسم مرتبطة.');
    return;
  }
  if(!Array.isArray(STATE.approvalPolicies)) STATE.approvalPolicies=[];
  const idx=STATE.approvalPolicies.findIndex(x=>x.moduleKey===k);
  if(idx>=0) STATE.approvalPolicies[idx]=p; else STATE.approvalPolicies.push(p);
  await dbSet('approvalPolicies',STATE.approvalPolicies);
  modalState=null; render();
}
async function enableSuggestedApprovals(){
  if(!confirm('تفعيل الاعتماد للأقسام المهمة (مشتريات، توريدات، مخازن، تنفيذ، مستحدثات، عقود، مستخلصات، أوامر تغييرية، مطالبات، استلام وتسليم)؟\nيمكنك لاحقاً تحديد التخصصات والمديرين لكل قسم.')) return;
  ensureDefaultApprovalPolicies();
  for(const k of DEFAULT_APPROVAL_MODULES){
    if(!MODULES[k]) continue;
    const mod=MODULES[k];
    let p=STATE.approvalPolicies.find(x=>x.moduleKey===k);
    if(!p){
      p={moduleKey:k,enabled:true,permissionKey:mod.permKey||'',approverIds:[],approverSpecialties:[],requiredLevel:'edit',label:'اعتماد '+mod.title};
      STATE.approvalPolicies.push(p);
    }else{
      p.enabled=true;
      if(!p.label) p.label='اعتماد '+mod.title;
      if(!p.permissionKey) p.permissionKey=mod.permKey||'';
    }
  }
  await dbSet('approvalPolicies',STATE.approvalPolicies);
  alert('تم تفعيل الاعتماد للأقسام المهمة. افتح «إعداد» لكل قسم لاختيار التخصصات والمديرين المؤهلين.');
  render();
}

/* ===================== Activity Log ===================== */
function activityLogHTML(){
  const entries = [];
  for(const key of Object.keys(MODULES)){
    const list = STATE[key] || [];
    for(const r of list){
      if(r.createdByName || r.createdBy){
        entries.push({date:r.date||r.startDate||'', who:r.createdByName||r.createdBy, action:'إضافة', module:MODULES[key].title});
      }
      if(r.updatedByName){
        entries.push({date:r.date||r.startDate||'', who:r.updatedByName, action:'تعديل', module:MODULES[key].title});
      }
    }
  }
  const rows = entries.map(e=>`
    <tr>
      <td>${escapeHtml(e.module)}</td>
      <td><span class="badge ${e.action==='إضافة'?'ok':'warn'}">${e.action}</span></td>
      <td>${escapeHtml(e.who)}</td>
      <td>${escapeHtml(e.date||'—')}</td>
    </tr>`).join('');
  return `
    <div class="section-note">سجل بكل عمليات الإضافة والتعديل عبر كل أقسام النظام، مرتب حسب القسم.</div>
    <div class="toolbar no-print"><div></div><button class="btn btn-ghost" onclick="window.print()">🖨️ طباعة</button></div>
    <table>
      <thead><tr><th>القسم</th><th>العملية</th><th>بواسطة</th><th>تاريخ السجل</th></tr></thead>
      <tbody>${rows || `<tr class="empty-row"><td colspan="4">لا توجد عمليات مسجلة بعد</td></tr>`}</tbody>
    </table>
  `;
}

/* ===================== Backup / Restore ===================== */
async function exportBackup(){
  const allKeys = ['users','specialties', ...Object.keys(MODULES), 'handoverInspections','handoverPunchList','handoverApprovals','handoverCloseouts'];
  const dump = {};
  for(const k of allKeys){ dump[k] = STATE[k] || []; }
  const blob = new Blob([JSON.stringify(dump, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'erp-backup-' + todayISO() + '.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

async function importBackupFile(input){
  const file = input.files && input.files[0];
  if(!file) return;
  if(!confirm('استيراد النسخة الاحتياطية هيستبدل البيانات الحالية في الأقسام الموجودة بالملف. متأكد؟')) { input.value=''; return; }
  try{
    const text = await file.text();
    const dump = JSON.parse(text);
    for(const key of Object.keys(dump)){
      STATE[key] = dump[key];
      await dbSet(key, dump[key]);
    }
    alert('تم استرجاع النسخة الاحتياطية بنجاح.');
    render();
  }catch(e){
    console.error(e);
    alert('تعذرت قراءة الملف — تأكد إنه ملف Backup صحيح.');
  }
  input.value = '';
}

function backupHTML(){
  return `
    <div class="section-note">
      يمكنك تحميل نسخة احتياطية كاملة من كل بيانات النظام كملف JSON، أو استرجاع نسخة سابقة.
    </div>
    <div style="display:flex;gap:14px;flex-wrap:wrap;">
      <div class="stat-card" style="flex:1;min-width:240px;">
        <div class="l" style="margin-bottom:10px;">تنزيل نسخة احتياطية من كل البيانات</div>
        <button class="btn btn-amber" onclick="exportBackup()">⬇️ تحميل Backup</button>
      </div>
      <div class="stat-card" style="flex:1;min-width:240px;">
        <div class="l" style="margin-bottom:10px;">استرجاع نسخة احتياطية (ملف JSON)</div>
        <input type="file" accept="application/json" onchange="importBackupFile(this)">
      </div>
    </div>
  `;
}

function render(){
  const app = document.getElementById('app');
  if(!currentUser){
    app.innerHTML = loginScreen();
    attachLoginHandlers();
    return;
  }
  app.innerHTML = mainLayout();
}

setInterval(()=>{
  const el=document.getElementById('epmsClock');
  if(el) el.textContent=new Date().toLocaleString('ar-EG',{dateStyle:'short',timeStyle:'short'});
},1000);

boot();
